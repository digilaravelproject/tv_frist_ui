<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSMIA Mumbai Live Flight Board</title>
    <link rel="preload" href="images/updating.mp4" as="video" type="video/mp4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="css/flights.css">
    <script src="../js/bridge.js" defer></script>
    <script src="../js/core/tv-core.js" defer></script>
    <script src="../js/core/tv-navigation.js" defer></script>
    <script src="js/flightdata.js" defer></script>
</head>
<body>
    <div id="bg-slider">
        <div class="slide active"></div>
        <div class="slide"></div>
    </div>
    <div class="flights-bg-overlay"></div>
    
    <!-- Top Header Bar -->
    <header class="flight-header">
        <div class="header-left">
            <button id="backBtn" class="back-btn-pill" tabindex="0" onclick="window.location.href='../index.html'">
                <i class="fa-solid fa-arrow-left"></i> BACK
            </button>
        </div>
        <div class="header-center">
            <div id="hotelLogoSlot" class="header-logo-slot"></div>
            <div class="airport-badge"><i class="fa-solid fa-plane"></i> CSMIA MUMBAI</div>
            <h1 id="airportTitle">CHHATRAPATI SHIVAJI MAHARAJ INTERNATIONAL AIRPORT</h1>
        </div>
        <div class="header-right"></div>
    </header>

    <!-- Main Container -->
    <main class="flight-board-wrapper">
        <div class="tabs-container">
            <button id="depBtn" class="flight-tab active" tabindex="0">
                <i class="fa-solid fa-plane-departure"></i> DEPARTURES
            </button>
            <button id="arrBtn" class="flight-tab" tabindex="0">
                <i class="fa-solid fa-plane-arrival"></i> ARRIVALS
            </button>
        </div>

        <div class="table-container" id="mainBox">
            <div id="videoOverlay">
                <div class="sync-content">
                    <video id="syncVideo" 
                           width="200" 
                           height="200" 
                           loop 
                           muted 
                           playsinline 
                           poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                        <source src="images/updating.mp4" type="video/mp4">
                    </video>
                    <div class="sync-text" id="sync-text">Updating Flights Data...</div>
                </div>
            </div>

            <table id="flightTable">
                <thead>
                    <tr>
                        <th id="th-time"><i class="fa-regular fa-clock"></i> TIME</th>
                        <th id="th-flight"><i class="fa-solid fa-plane-up"></i> FLIGHT</th>
                        <th id="th-terminal"><i class="fa-solid fa-building"></i> TERMINAL</th> 
                        <th id="th-airline"><i class="fa-solid fa-passport"></i> AIRLINE</th>
                        <th id="headerLabel"><i class="fa-solid fa-location-dot"></i> DESTINATION</th>
                        <th id="th-status"><i class="fa-solid fa-circle-info"></i> STATUS</th>
                    </tr>
                </thead>
                <tbody id="flightBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="footer-info">
        <div class="footer-left">
            <div id="lastUpdated" class="last-updated-badge">
                <i class="fa-solid fa-rotate-right"></i> Last Refreshed: --:--
            </div>
        </div>
        <div class="center-controls">
            <button id="prevBtn" class="flight-btn-sec" tabindex="0">
                <i class="fa-solid fa-chevron-left"></i> PREV
            </button>
            <button id="nextBtn" class="flight-btn-sec" tabindex="0">
                NEXT <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
        <div class="footer-right">
            <button id="refreshBtn" class="flight-btn-action" tabindex="0">
                <i class="fa-solid fa-arrows-rotate"></i> REFRESH
            </button>
        </div>
    </footer>
</body>
</html>
