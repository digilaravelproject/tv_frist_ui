<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Language</title>
    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="css/global.css">
    <!-- PAGE CSS -->
    <link rel="stylesheet" href="css/pages/languages.css">

    <!-- CORE JS -->
    <script src="js/bridge.js" defer></script>
    <script src="js/core/tv-core.js" defer></script>
    <script src="js/core/tv-navigation.js" defer></script>
    
    <!-- PAGE JS -->
    <script src="js/pages/languages.js" defer></script>
</head>
<body class="page-centered">
    <div id="bg-slider">
        <div class="slide active"></div>
        <div class="slide"></div>
    </div>

    <div class="lang-modal-container">
        <div class="lang-header">
            <div class="header-icon">🌐</div>
            <div class="header-text-group">
                <h1 class="header-title" id="titleText">SELECT LANGUAGE</h1>
                <p class="header-subtitle" id="subtitleText">Choose your preferred system language</p>
            </div>
        </div>

        <div class="lang-grid-container" id="langList"></div>

        <div class="lang-actions">
            <button class="btn btn-apply" id="applyBtn" tabindex="0">
                <span class="btn-icon">✓</span>
                <span id="btnApplyText">Apply & Continue</span>
            </button>
            <button class="btn btn-cancel" id="cancelBtn" tabindex="0">
                <span class="btn-icon">✕</span>
                <span id="btnCancelText">Back</span>
            </button>
        </div>
    </div>
</body>
</html>
